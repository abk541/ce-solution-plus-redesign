name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Syntax, references and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check scripts
        run: |
          node --check main.js
          node --check stars-gl.js
          node --check serve.mjs
          node --check tools/assemble.mjs

      - name: Assemble site and verify local references
        run: node tools/assemble.mjs

      - name: Lighthouse (accessibility gate, performance report)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
